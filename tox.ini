[tox]
envlist = py312, py313
skipsdist = false
minversion = 4.0

[testenv]
description = Run tests with pytest
deps =
    -rrequirements/base.txt
    -rrequirements/dev.txt
passenv =
    DJANGO_SETTINGS_MODULE
    SECRET_KEY
    HOME
    USERPROFILE
setenv =
    DJANGO_SETTINGS_MODULE = config.settings.test
    PYTHONPATH = {toxinidir}
    SECRET_KEY = tox-test-secret-key-do-not-use-in-prod
commands =
    python --version
    python -m pytest {posargs:--tb=short -v}

[testenv:lint]
description = Run linters
deps =
    ruff
    mypy
    django-stubs
commands =
    ruff check apps core
    ruff format --check apps core

[testenv:typecheck]
description = Run mypy type checking
deps =
    -rrequirements/base.txt
    mypy
    django-stubs
    drf-spectacular
commands =
    mypy apps core --show-error-codes

[gh]
python =
    3.12: py312
    3.13: py313
