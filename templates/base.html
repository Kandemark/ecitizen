<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}e-Citizen Kenya{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
  <link rel="stylesheet" as="style"
    onload="this.rel='stylesheet'"
    href="https://fonts.googleapis.com/css2?display=swap&family=Public+Sans:wght@400;500;600;700;900&family=Noto+Sans:wght@400;500;700;900" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <style>[x-cloak]{display:none!important}</style>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/ecitizen.css' %}" />
  {% block extra_head %}{% endblock %}
</head>
<body class="font-sans antialiased bg-white text-[#111418]">
  {% include 'components/header.html' %}
  <main class="min-h-screen">
    {% block content %}{% endblock %}
  </main>
  {% include 'components/footer.html' %}
  {% block extra_js %}{% endblock %}
</body>
</html>
