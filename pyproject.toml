[build-system]
requires = ["setuptools>=75.0", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "ecitizen"
version = "1.0.0"
description = "Kenya e-Citizen Government Services Platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Government of Kenya"}
authors = [
    {name = "e-Citizen Development Team", email = "dev@ecitizen.go.ke"},
]
keywords = ["ecitizen", "kenya", "government-services", "django"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Government",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.15,<3.16",
    "djangorestframework-simplejwt>=5.4,<5.5",
    "django-cors-headers>=4.7,<4.8",
    "django-filter>=24.1,<25.0",
    "django-modeltranslation>=0.19,<0.20",
    "django-storages>=1.14,<2.0",
    "django-watson>=1.6,<2.0",
    "drf-spectacular>=0.28,<0.29",
    "celery>=5.4,<5.5",
    "redis>=5.2,<5.3",
    "whitenoise>=6.7,<7.0",
    "python-dotenv>=1.0,<2.0",
    "Pillow>=11.0,<12.0",
    "psycopg2-binary>=2.9,<3.0",
    "gunicorn>=23.0,<24.0",
]

[project.optional-dependencies]
dev = [
    "django-extensions>=3.2,<4.0",
    "django-debug-toolbar>=4.4,<5.0",
    "django-silk>=5.3,<5.4",
    "pytest>=8.3,<9.0",
    "pytest-django>=4.8,<5.0",
    "pytest-cov>=5.0,<6.0",
    "factory-boy>=3.3,<4.0",
    "ipython>=8.29,<9.0",
    "tox>=4.23,<5.0",
]
prod = [
    "httpx>=0.28,<1.0",
    "feedparser>=6.0,<7.0",
    "django-csp>=3.8,<4.0",
    "WeasyPrint>=62,<63",
    "africastalking-python>=1.3,<2.0",
    "firebase-admin>=6.5,<7.0",
    "openpyxl>=3.1,<4.0",
]

[project.scripts]
ecitizen = "manage:main"

[project.urls]
Homepage = "https://ecitizen.go.ke"
Documentation = "https://developers.ecitizen.go.ke"
Repository = "https://github.com/kenya-government/ecitizen"
Issues = "https://github.com/kenya-government/ecitizen/issues"

[tool.setuptools]
packages = {find = {exclude = ["tests*", "docs*", "venv*", ".claude*"]}}
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.html", "*.json", "*.xml", "*.yml", "*.yaml", "*.mo", "*.po", "*.css", "*.js"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
addopts = "--strict-markers -v --tb=short --no-migrations"
testpaths = ["apps"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["apps", "core"]
omit = ["*/migrations/*", "*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
fail_under = 0

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin"]
strict = false
ignore_missing_imports = true
exclude = ["venv/", ".claude/", "docs/"]

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["venv", ".claude", "docs", "migrations"]
lint.select = ["E", "F", "I", "N", "W", "UP"]
lint.ignore = ["E501"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
