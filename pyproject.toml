[project]
name = "ecitizen"
version = "1.0.0"
description = "Kenya e-Citizen Government Services Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ecitizen = "manage:main"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
addopts = "--strict-markers -v --tb=short"
testpaths = ["apps"]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["apps", "core"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.mypy]
plugins = ["mypy_django_plugin"]

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.ruff]
target-version = "py312"
line-length = 100
