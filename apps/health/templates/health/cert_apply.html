{% extends "base.html" %}
{% block title %}Apply for Medical Certificate — e-Citizen{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-10 py-6 sm:py-7 lg:py-8 page-enter">
  <a href="{% url 'health:list' %}" class="text-sm text-[#60758a] hover:text-[#0b6e4f] transition mb-6 inline-block">← Back to Health</a>
  <h1 class="text-2xl font-bold text-[#111418] mb-1">Apply for Medical Certificate</h1>
  <p class="text-[#60758a] mb-8">Request a medical certificate from a registered facility.</p>
  <form method="POST" class="card space-y-5">
    {% csrf_token %}
    <div><label class="block text-sm font-medium text-[#111418] mb-1">Certificate Type *</label><select name="certificate_type" required class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none bg-white">{% for v,l in cert_types %}<option value="{{ v }}">{{ l }}</option>{% endfor %}</select></div>
    <div><label class="block text-sm font-medium text-[#111418] mb-1">Issuing Facility *</label><input type="text" name="issuing_facility" required placeholder="e.g. Kenyatta National Hospital" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none"></div>
    <div><label class="block text-sm font-medium text-[#111418] mb-1">Issuing Practitioner</label><input type="text" name="issuing_practitioner" placeholder="Dr. Name" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none"></div>
    <div><label class="block text-sm font-medium text-[#111418] mb-1">Findings / Notes</label><textarea name="findings" rows="2" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none"></textarea></div>
    <div class="flex justify-end gap-3 pt-4 border-t border-[#f0f2f5]"><a href="{% url 'health:list' %}" class="btn-outline">Cancel</a><button type="submit" class="btn-primary">Submit</button></div>
  </form>
</div>
{% endblock %}
