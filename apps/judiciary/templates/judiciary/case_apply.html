{% extends "base.html" %}{% block title %}File Court Case — e-Citizen{% endblock %}{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-10 py-6 sm:py-7 lg:py-8 page-enter">
  <a href="{% url 'judiciary:list' %}" class="text-sm text-[#60758a] hover:text-[#0b6e4f] transition mb-6 inline-block">← Back to Judiciary</a>
  <h1 class="text-2xl font-bold text-[#111418] mb-1">File Court Case</h1><p class="text-[#60758a] mb-8">Register a new court case.</p>
  <form method="POST" class="card space-y-5">{% csrf_token %}
    <div class="grid grid-cols-2 gap-4"><div><label class="block text-sm font-medium text-[#111418] mb-1">Case Number *</label><input type="text" name="case_number" required placeholder="e.g. HCC/123/2026" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none"></div><div><label class="block text-sm font-medium text-[#111418] mb-1">Case Type *</label><select name="case_type" required class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none bg-white">{% for v,l in case_types %}<option value="{{ v }}">{{ l }}</option>{% endfor %}</select></div></div>
    <div><label class="block text-sm font-medium text-[#111418] mb-1">Court Name *</label><select name="court_name" required class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none bg-white"><option>Supreme Court of Kenya</option><option>Court of Appeal — Nairobi</option><option>High Court — Nairobi (Milimani)</option><option>High Court — Mombasa</option><option>High Court — Kisumu</option><option>Employment and Labour Relations Court</option><option>Environment and Land Court</option><option>Chief Magistrate's Court</option></select></div>
    <div><label class="block text-sm font-medium text-[#111418] mb-1">Title</label><input type="text" name="title" placeholder="e.g. John Doe vs Jane Smith" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none"></div>
    <div><label class="block text-sm font-medium text-[#111418] mb-1">Description</label><textarea name="description" rows="3" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none"></textarea></div>
    <div class="flex justify-end gap-3 pt-4 border-t border-[#f0f2f5]"><a href="{% url 'judiciary:list' %}" class="btn-outline">Cancel</a><button type="submit" class="btn-primary">File Case</button></div>
  </form>
</div>{% endblock %}
