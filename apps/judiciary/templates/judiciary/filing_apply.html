{% extends "base.html" %}{% block title %}Submit Filing — e-Citizen{% endblock %}{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-10 py-6 sm:py-7 lg:py-8 page-enter">
  <a href="{% url 'judiciary:list' %}" class="text-sm text-[#60758a] hover:text-[#0b6e4f] transition mb-6 inline-block">← Back to Judiciary</a>
  <h1 class="text-2xl font-bold text-[#111418] mb-1">Submit Filing</h1><p class="text-[#60758a] mb-8">File a document in an existing court case.</p>
  <form method="POST" class="card space-y-5">{% csrf_token %}
    {% if cases %}<div><label class="block text-sm font-medium text-[#111418] mb-1">Court Case *</label><select name="case" required class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none bg-white"><option value="">-- Select --</option>{% for c in cases %}<option value="{{ c.id }}" {% if pre_selected_case and pre_selected_case.id == c.id %}selected{% endif %}>{{ c.case_number }} — {{ c.court_name }}</option>{% endfor %}</select></div>{% else %}<div class="bg-[#f7f8fa] border border-[#f0f2f5] rounded-lg p-4 text-sm"><p>No court cases. <a href="{% url 'judiciary:case_file' %}" class="text-[#0b6e4f] font-medium">File one first →</a></p></div>{% endif %}
    <div class="grid grid-cols-2 gap-4"><div><label class="block text-sm font-medium text-[#111418] mb-1">Filing Type *</label><select name="filing_type" required class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none bg-white">{% for v,l in filing_types %}<option value="{{ v }}">{{ l }}</option>{% endfor %}</select></div><div><label class="block text-sm font-medium text-[#111418] mb-1">Title</label><input type="text" name="title" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none"></div></div>
    <div><label class="block text-sm font-medium text-[#111418] mb-1">Description</label><textarea name="description" rows="3" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none"></textarea></div>
    <div class="flex justify-end gap-3 pt-4 border-t border-[#f0f2f5]"><a href="{% url 'judiciary:list' %}" class="btn-outline">Cancel</a><button type="submit" class="btn-primary" {% if not cases %}disabled{% endif %}>Submit Filing</button></div>
  </form>
</div>{% endblock %}
