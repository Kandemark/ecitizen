{% extends "base.html" %}{% block title %}Pay Fine — e-Citizen{% endblock %}{% block content %}
<div class="max-w-2xl mx-auto px-10 py-8 page-enter">
  <a href="{% url 'judiciary:list' %}" class="text-sm text-[#60758a] hover:text-[#0b6e4f] transition mb-6 inline-block">← Back to Judiciary</a>
  <h1 class="text-2xl font-bold text-[#111418] mb-1">Pay Fine</h1><p class="text-[#60758a] mb-8">Register a court-imposed fine for payment.</p>
  <form method="POST" class="card space-y-5">{% csrf_token %}
    <div><label class="block text-sm font-medium text-[#111418] mb-1">Offense Description *</label><textarea name="offense" required rows="2" placeholder="Details of the offense" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none"></textarea></div>
    <div class="grid grid-cols-2 gap-4"><div><label class="block text-sm font-medium text-[#111418] mb-1">Amount (KES) *</label><input type="number" name="amount" required min="0" step="0.01" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none"></div><div><label class="block text-sm font-medium text-[#111418] mb-1">Due Date</label><input type="date" name="due_date" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none"></div></div>
    <div class="flex justify-end gap-3 pt-4 border-t border-[#f0f2f5]"><a href="{% url 'judiciary:list' %}" class="btn-outline">Cancel</a><button type="submit" class="btn-primary">Register Fine</button></div>
  </form>
</div>{% endblock %}
