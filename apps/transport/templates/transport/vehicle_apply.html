{% extends "base.html" %}
{% block title %}Register Vehicle — e-Citizen{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto px-10 py-8 page-enter">
  <a href="{% url 'transport:list' %}" class="text-sm text-[#60758a] hover:text-[#0b6e4f] transition mb-6 inline-block">← Back to Transport</a>
  <h1 class="text-2xl font-bold text-[#111418] mb-1">Register Vehicle</h1>
  <p class="text-[#60758a] mb-8">Provide vehicle details for registration.</p>
  <form method="POST" class="card space-y-5">
    {% csrf_token %}
    <div>
      <label class="block text-sm font-medium text-[#111418] mb-1">Plate Number *</label>
      <input type="text" name="plate_number" required placeholder="e.g. KCB 123A" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none">
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-[#111418] mb-1">Make *</label>
        <input type="text" name="vehicle_make" required placeholder="e.g. Toyota" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-[#111418] mb-1">Model</label>
        <input type="text" name="vehicle_model" placeholder="e.g. Corolla" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none">
      </div>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-[#111418] mb-1">Year of Manufacture</label>
        <input type="number" name="year_of_manufacture" min="1970" max="2026" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-[#111418] mb-1">Color</label>
        <input type="text" name="color" placeholder="e.g. White" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none">
      </div>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-[#111418] mb-1">VIN / Chassis Number</label>
        <input type="text" name="vin" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-[#111418] mb-1">Engine Number</label>
        <input type="text" name="engine_number" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none">
      </div>
    </div>
    <div class="flex justify-end gap-3 pt-4 border-t border-[#f0f2f5]">
      <a href="{% url 'transport:list' %}" class="btn-outline">Cancel</a>
      <button type="submit" class="btn-primary">Register Vehicle</button>
    </div>
  </form>
</div>
{% endblock %}
