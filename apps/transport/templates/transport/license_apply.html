{% extends "base.html" %}
{% block title %}Apply for Driving License — e-Citizen{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-10 py-6 sm:py-7 lg:py-8 page-enter">
  <a href="{% url 'transport:list' %}" class="text-sm text-[#60758a] hover:text-[#0b6e4f] transition mb-6 inline-block">← Back to Transport</a>
  <h1 class="text-2xl font-bold text-[#111418] mb-1">Apply for Driving License</h1>
  <p class="text-[#60758a] mb-8">Select the license class you wish to apply for.</p>
  <form method="POST" class="card space-y-5">
    {% csrf_token %}
    <div>
      <label class="block text-sm font-medium text-[#111418] mb-1">License Class *</label>
      <select name="license_class" required class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none bg-white">
        {% for value, label in classes %}<option value="{{ value }}">{{ label }}</option>{% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-[#111418] mb-1">Blood Group</label>
      <select name="blood_group" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none bg-white">
        <option value="">-- Select --</option>
        <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
        <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
      </select>
    </div>
    <div class="flex justify-end gap-3 pt-4 border-t border-[#f0f2f5]">
      <a href="{% url 'transport:list' %}" class="btn-outline">Cancel</a>
      <button type="submit" class="btn-primary">Submit Application</button>
    </div>
  </form>
</div>
{% endblock %}
