{% extends "base.html" %}{% block title %}Submit Bid — e-Citizen{% endblock %}{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-10 py-6 sm:py-7 lg:py-8 page-enter">
  <a href="{% url 'procurement:tender_detail' ref=tender.reference %}" class="text-sm text-[#60758a] hover:text-[#0b6e4f] transition mb-6 inline-block">← Back to Tender</a>
  <h1 class="text-2xl font-bold text-[#111418] mb-1">Submit Bid</h1><p class="text-[#60758a] mb-2">{{ tender.title|truncatechars:100 }}</p><p class="text-sm text-red-500 mb-8">Closes: {{ tender.closing_date|date:"d M Y, H:i" }}</p>
  <form method="POST" class="card space-y-5">{% csrf_token %}
    <div class="grid grid-cols-2 gap-4"><div><label class="block text-sm font-medium text-[#111418] mb-1">Bid Amount (KES) *</label><input type="number" name="bid_amount" required min="0" step="0.01" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none"></div><div><label class="block text-sm font-medium text-[#111418] mb-1">Company Name *</label><input type="text" name="company_name" required class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none"></div></div>
    <div class="grid grid-cols-2 gap-4"><div><label class="block text-sm font-medium text-[#111418] mb-1">Registration Number</label><input type="text" name="registration_number" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none"></div><div><label class="block text-sm font-medium text-[#111418] mb-1">Bid Bond Reference</label><input type="text" name="bid_bond_reference" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none"></div></div>
    <div class="flex justify-end gap-3 pt-4 border-t border-[#f0f2f5]"><a href="{% url 'procurement:tender_detail' ref=tender.reference %}" class="btn-outline">Cancel</a><button type="submit" class="btn-primary">Submit Bid</button></div>
  </form>
</div>{% endblock %}
