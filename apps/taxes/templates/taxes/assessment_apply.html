{% extends "base.html" %}
{% block title %}Request Tax Assessment — e-Citizen{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-10 py-6 sm:py-7 lg:py-8 page-enter">
  <a href="{% url 'taxes:list' %}" class="text-sm text-[#60758a] hover:text-[#0b6e4f] transition mb-6 inline-block">← Back to Taxes</a>
  <h1 class="text-2xl font-bold text-[#111418] mb-1">Request Tax Assessment</h1>
  <p class="text-[#60758a] mb-8">Request a self-assessment or KRA assessment for a given year.</p>
  <form method="POST" class="card space-y-5">
    {% csrf_token %}
    <div class="grid grid-cols-2 gap-4">
      <div><label class="block text-sm font-medium text-[#111418] mb-1">Assessment Year *</label><input type="number" name="assessment_year" required min="2020" max="2026" value="2026" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none"></div>
      <div><label class="block text-sm font-medium text-[#111418] mb-1">Tax Type *</label><select name="tax_type" required class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none bg-white">{% for v,l in tax_types %}<option value="{{ v }}">{{ l }}</option>{% endfor %}</select></div>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div><label class="block text-sm font-medium text-[#111418] mb-1">Total Income (KES)</label><input type="number" name="total_income" min="0" step="0.01" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none"></div>
      <div><label class="block text-sm font-medium text-[#111418] mb-1">KRA PIN</label><input type="text" name="kra_pin" placeholder="A000123456Z" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none"></div>
    </div>
    <div class="flex justify-end gap-3 pt-4 border-t border-[#f0f2f5]"><a href="{% url 'taxes:list' %}" class="btn-outline">Cancel</a><button type="submit" class="btn-primary">Submit</button></div>
  </form>
</div>
{% endblock %}
