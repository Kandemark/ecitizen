{% extends "base.html" %}
{% block title %}Apply for Education Loan — e-Citizen{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto px-10 py-8 page-enter">
  <a href="{% url 'education:list' %}" class="text-sm text-[#60758a] hover:text-[#0b6e4f] transition mb-6 inline-block">← Back to Education</a>
  <h1 class="text-2xl font-bold text-[#111418] mb-1">Apply for Education Loan</h1>
  <p class="text-[#60758a] mb-8">Submit a HELB or bursary loan application.</p>
  <form method="POST" class="card space-y-5">
    {% csrf_token %}
    <div><label class="block text-sm font-medium text-[#111418] mb-1">Loan Type *</label><select name="loan_type" required class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none bg-white">{% for v,l in loan_types %}<option value="{{ v }}">{{ l }}</option>{% endfor %}</select></div>
    <div><label class="block text-sm font-medium text-[#111418] mb-1">Institution *</label><input type="text" name="institution" required placeholder="e.g. University of Nairobi" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none"></div>
    <div class="grid grid-cols-2 gap-4">
      <div><label class="block text-sm font-medium text-[#111418] mb-1">Campus</label><input type="text" name="campus" placeholder="e.g. Main Campus" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none"></div>
      <div><label class="block text-sm font-medium text-[#111418] mb-1">Course of Study</label><input type="text" name="course_of_study" placeholder="e.g. Computer Science" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none"></div>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div><label class="block text-sm font-medium text-[#111418] mb-1">Year of Study</label><input type="number" name="year_of_study" min="1" max="7" value="1" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none"></div>
      <div><label class="block text-sm font-medium text-[#111418] mb-1">Amount Requested (KES)</label><input type="number" name="amount" min="0" step="0.01" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none"></div>
    </div>
    <div class="flex justify-end gap-3 pt-4 border-t border-[#f0f2f5]"><a href="{% url 'education:list' %}" class="btn-outline">Cancel</a><button type="submit" class="btn-primary">Submit Application</button></div>
  </form>
</div>
{% endblock %}
