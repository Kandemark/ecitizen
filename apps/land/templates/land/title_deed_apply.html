{% extends "base.html" %}

{% block title %}Register Title Deed — e-Citizen{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-10 py-6 sm:py-7 lg:py-8 page-enter">
  <a href="{% url 'land:list' %}" class="text-sm text-[#60758a] hover:text-[#0b6e4f] transition mb-6 inline-block">← Back to Land Services</a>

  <h1 class="text-2xl font-bold text-[#111418] mb-1">Register Title Deed</h1>
  <p class="text-[#60758a] mb-8">Provide property and ownership details for title deed registration.</p>

  <form method="POST" class="card space-y-5">
    {% csrf_token %}
    <div>
      <label class="block text-sm font-medium text-[#111418] mb-1">Title Number *</label>
      <input type="text" name="title_number" required placeholder="e.g. NAIROBI/BLOCK12/345"
             class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none">
    </div>
    <div>
      <label class="block text-sm font-medium text-[#111418] mb-1">Property Location *</label>
      <textarea name="property_location" required rows="2" placeholder="Full address of the property"
                class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none"></textarea>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-[#111418] mb-1">County</label>
        <select name="county" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none bg-white">
          <option value="">-- Select --</option>
          {% for c in counties %}
          <option value="{{ c.id }}">{{ c.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-[#111418] mb-1">Tenure Type *</label>
        <select name="tenure_type" required class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none bg-white">
          {% for t in tenure_types %}
          <option value="{{ t }}">{{ t|title }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-[#111418] mb-1">Land Size (hectares)</label>
        <input type="number" name="land_size_hectares" step="0.01" min="0" placeholder="0.00"
               class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-[#111418] mb-1">Registered Owner *</label>
        <input type="text" name="registered_owner_name" required placeholder="Full legal name"
               class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none">
      </div>
    </div>
    <div>
      <label class="block text-sm font-medium text-[#111418] mb-1">Encumbrances</label>
      <textarea name="encumbrances" rows="2" placeholder="Any charges, mortgages, or restrictions on this title"
                class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none"></textarea>
    </div>

    <div class="flex justify-end gap-3 pt-4 border-t border-[#f0f2f5]">
      <a href="{% url 'land:list' %}" class="btn-outline">Cancel</a>
      <button type="submit" class="btn-primary">Submit Registration</button>
    </div>
  </form>
</div>
{% endblock %}
