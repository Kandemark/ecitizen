{% extends "base.html" %}{% block title %}Apply for Professional Certification — e-Citizen{% endblock %}{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-10 py-6 sm:py-7 lg:py-8 page-enter">
  <a href="{% url 'licenses:list' %}" class="text-sm text-[#60758a] hover:text-[#0b6e4f] transition mb-6 inline-block">← Back to Licenses</a>
  <h1 class="text-2xl font-bold text-[#111418] mb-1">Apply for Professional Certification</h1><p class="text-[#60758a] mb-8">Register your professional certification or license.</p>
  <form method="POST" class="card space-y-5">{% csrf_token %}
    <div><label class="block text-sm font-medium text-[#111418] mb-1">Certification Name *</label><input type="text" name="certification_name" required placeholder="e.g. Certified Public Accountant" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none"></div>
    <div class="grid grid-cols-2 gap-4"><div><label class="block text-sm font-medium text-[#111418] mb-1">Certification Type *</label><select name="certification_type" required class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none bg-white">{% for v,l in cert_types %}<option value="{{ v }}">{{ l }}</option>{% endfor %}</select></div><div><label class="block text-sm font-medium text-[#111418] mb-1">Registration Number</label><input type="text" name="registration_number" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none"></div></div>
    <div><label class="block text-sm font-medium text-[#111418] mb-1">Issuing Body *</label><input type="text" name="issuing_body" required placeholder="e.g. ICPAK, EBK, LSK" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none"></div>
    <div class="flex justify-end gap-3 pt-4 border-t border-[#f0f2f5]"><a href="{% url 'licenses:list' %}" class="btn-outline">Cancel</a><button type="submit" class="btn-primary">Submit</button></div>
  </form>
</div>{% endblock %}
