{% extends "base.html" %}{% block title %}Apply for Business License — e-Citizen{% endblock %}{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-10 py-6 sm:py-7 lg:py-8 page-enter">
  <a href="{% url 'licenses:list' %}" class="text-sm text-[#60758a] hover:text-[#0b6e4f] transition mb-6 inline-block">← Back to Licenses</a>
  <h1 class="text-2xl font-bold text-[#111418] mb-1">Apply for Business License</h1><p class="text-[#60758a] mb-8">Register your business and obtain a trading license.</p>
  <form method="POST" class="card space-y-5">{% csrf_token %}
    <div><label class="block text-sm font-medium text-[#111418] mb-1">Business Name *</label><input type="text" name="business_name" required class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none"></div>
    <div class="grid grid-cols-2 gap-4"><div><label class="block text-sm font-medium text-[#111418] mb-1">License Type *</label><select name="license_type" required class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none bg-white">{% for v,l in license_types %}<option value="{{ v }}">{{ l }}</option>{% endfor %}</select></div><div><label class="block text-sm font-medium text-[#111418] mb-1">County</label><select name="county" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none bg-white"><option value="">-- Select --</option>{% for c in counties %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></div></div>
    <div><label class="block text-sm font-medium text-[#111418] mb-1">Registration Number</label><input type="text" name="registration_number" placeholder="e.g. BRS/123456" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none"></div>
    <div><label class="block text-sm font-medium text-[#111418] mb-1">Physical Address</label><textarea name="physical_address" rows="2" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none"></textarea></div>
    <div class="grid grid-cols-3 gap-4"><div><label class="block text-sm font-medium text-[#111418] mb-1">Postal Address</label><input type="text" name="postal_address" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none"></div><div><label class="block text-sm font-medium text-[#111418] mb-1">Email</label><input type="email" name="business_email" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none"></div><div><label class="block text-sm font-medium text-[#111418] mb-1">Phone</label><input type="text" name="business_phone" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none"></div></div>
    <div><label class="block text-sm font-medium text-[#111418] mb-1">Number of Employees</label><input type="number" name="number_of_employees" min="0" value="0" class="w-full border border-[#dbe0e6] rounded-lg px-4 py-2.5 text-sm focus:outline-none"></div>
    <div class="flex justify-end gap-3 pt-4 border-t border-[#f0f2f5]"><a href="{% url 'licenses:list' %}" class="btn-outline">Cancel</a><button type="submit" class="btn-primary">Submit</button></div>
  </form>
</div>{% endblock %}
